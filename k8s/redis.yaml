apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: k8s-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      imagePullSecrets:
        - name: aliyun-registry
      containers:
        - name: redis
          image: registry.cn-beijing.aliyuncs.com/docker-june/redis:7-alpine
          imagePullPolicy: Always
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: k8s-demo
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
